services:
  - type: web
    name: lamchamecz-dashboard-1nez
    runtime: docker
    plan: free
    healthCheckPath: /login/
    envVars:
      - key: DJANGO_ALLOWED_HOSTS
        value: lamchamecz-dashboard.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://lamchamecz-dashboard.onrender.com
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: lamchamecz-db
          property: connectionString
      - key: CREATE_SUPERUSER
        value: "1"
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_FULLNAME
        value: Administrator

databases:
  - name: lamchamecz-db
    plan: free
    databaseName: lcm
    user: lcm
