{% extends "base.html" %}
{% load i18n %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<header class="section">
  <h2 class="mb-1">{{ title }}</h2>
  <p class="text-muted">{% trans "Student details." %}</p>
</header>

<form method="post" class="form-card">
  {% csrf_token %}
  {% include "core/_form_fields.html" %}
  <div class="form-actions">
    <button type="submit" class="btn btn--primary">{% trans "Save" %}</button>
    <a href="{% url 'student_list' %}" class="btn btn--secondary">{% trans "Cancel" %}</a>
  </div>
</form>
{% endblock %}
