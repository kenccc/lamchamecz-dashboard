{% extends "base.html" %}
{% load i18n %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<header class="section">
  <h2 class="mb-1">{{ title }}</h2>
  <p class="text-muted">{% trans "Creates a new user account." %}</p>
</header>

<form method="post" class="form-card">
  {% csrf_token %}
  {% include "core/_form_fields.html" %}
  <div class="form-actions">
    <button class="btn btn--primary" type="submit">{% trans "Create" %}</button>
    <a class="btn btn--secondary" href="{% url 'dashboard' %}">{% trans "Cancel" %}</a>
  </div>
</form>
{% endblock %}
